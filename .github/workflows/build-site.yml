name: Build site from source.txt

on:
  push:
    branches: [main]
    paths: ["source.txt", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py --build .
      - name: Commit rebuilt site if changed
        run: |
          git config user.name "constitution-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to site"
          else
            git commit -m "build: regenerate site from source.txt"
            git push
          fi
